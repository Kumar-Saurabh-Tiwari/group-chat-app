<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6fa">
    <title>Chats | GroupChat</title>
    <link rel="stylesheet" href="chat.css">
  </head>
  <body>
    <div class="auth-status" id="auth-status" role="status" aria-live="polite">Checking your session...</div>
    <main class="chat-app" aria-label="GroupChat">
      <aside class="conversation-panel" id="conversation-panel" aria-label="Conversations">
        <header class="sidebar-header">
          <a class="brand" href="index.html" aria-label="GroupChat home">
            <span class="brand-mark" aria-hidden="true">g</span>
            <span>groupchat</span>
          </a>
          <span class="profile-avatar" id="profile-avatar" aria-label="Your profile"></span>
        </header>

        <div class="inbox-heading">
          <div>
            <p class="eyebrow">YOUR SPACE</p>
            <h1>Messages</h1>
          </div>
          <span class="inbox-count" id="inbox-count" aria-label="Conversation count"></span>
        </div>

        <form class="personal-chat-form" id="personal-chat-form">
          <label for="personal-chat-email">Start a personal chat</label>
          <div class="personal-chat-controls">
            <input id="personal-chat-email" type="email" placeholder="User's email" autocomplete="email" required>
            <button type="submit">Chat</button>
          </div>
          <div class="personal-chat-results" id="personal-chat-results" role="listbox" aria-label="Matching users" hidden></div>
          <p id="personal-chat-status" role="status" aria-live="polite"></p>
        </form>

        <div class="group-chat-tools">
          <form id="create-group-form">
            <label for="group-name">Create a group</label>
            <div class="personal-chat-controls">
              <input id="group-name" type="text" maxlength="100" placeholder="Group name" required>
              <button type="submit">Create</button>
            </div>
          </form>
          <form id="join-group-form">
            <label for="group-invite-code">Join with invite code</label>
            <div class="personal-chat-controls">
              <input id="group-invite-code" type="text" maxlength="16" placeholder="16-character code" required>
              <button type="submit">Join</button>
            </div>
          </form>
          <p id="group-chat-status" role="status" aria-live="polite"></p>
        </div>

        <label class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
          <input id="conversation-search" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations">
          <kbd>/</kbd>
        </label>

        <div class="conversation-heading">
          <span>ALL CHATS</span>
        </div>
        <nav class="conversation-list" id="conversation-list" aria-label="All chats"></nav>
        <a class="sidebar-footer" href="index.html">
          <span class="footer-icon" aria-hidden="true">←</span>
          <span>Back to home</span>
        </a>
      </aside>

      <section class="conversation-view" aria-label="Chat conversation">
        <header class="chat-header">
          <button class="back-button" id="back-button" type="button" aria-label="Back to conversations">←</button>
          <div class="chat-avatar" id="chat-avatar" aria-hidden="true"></div>
          <div class="chat-heading">
            <h2 id="chat-title"></h2>
            <p id="chat-subtitle"></p>
          </div>
          <div class="header-actions">
            <span class="secure-label"><span aria-hidden="true">✦</span> Your little corner of the internet</span>
          </div>
        </header>

        <div class="message-area" id="message-area" aria-live="polite">
          <div class="message-list" id="message-list" aria-label="Messages"></div>
        </div>

        <form class="composer" id="message-form">
          <div class="composer-box">
            <div class="ai-suggestions" id="ai-suggestions" aria-label="AI suggestions" aria-live="polite" hidden></div>
            <label class="visually-hidden" for="message-input">Write a message</label>
            <textarea id="message-input" rows="1" maxlength="2000" placeholder="Write a message..."></textarea>
            <input id="attachment-input" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,audio/mpeg,audio/ogg,audio/wav,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" multiple>
            <div class="attachment-list" id="attachment-list" aria-live="polite"></div>
            <div class="composer-footer">
              <div class="composer-actions">
                <button class="attachment-button" id="attachment-button" type="button" aria-label="Attach photos, videos, audio, or files">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m20.5 11.5-8.8 8.8a5 5 0 0 1-7.1-7.1l9.2-9.2a3.3 3.3 0 0 1 4.7 4.7l-9.2 9.2a1.7 1.7 0 0 1-2.4-2.4l8.4-8.4"></path></svg>
                </button>
                <span class="composer-hint">Enter to send · Shift + Enter for a new line</span>
              </div>
              <button class="send-button" type="submit" aria-label="Send message">
                <span>Send</span>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1Z"></path><path d="m12 13 7-8"></path></svg>
              </button>
            </div>
            <p class="attachment-note" id="attachment-note" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>
    <dialog class="media-dialog" id="media-dialog" aria-labelledby="media-dialog-name">
      <div class="media-dialog-panel">
        <header class="media-dialog-header">
          <p class="media-dialog-name" id="media-dialog-name"></p>
          <button class="media-dialog-close" id="media-dialog-close" type="button" aria-label="Close preview">×</button>
        </header>
        <div class="media-dialog-content" id="media-dialog-content"></div>
      </div>
    </dialog>
    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
